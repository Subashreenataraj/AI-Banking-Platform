kind = "api"
    previewPath = "/api"
    title = "AI Banking Compliance API"
    version = "1.0.0"
    id = "3B4_FFSkEVBkAeYMFRJ2e"

    [[services]]
    localPort = 8000
    name = "API Server"
    paths = ["/api"]

    [services.development]
    run = "cd ../../services/compliance-api && python run.py"

    [services.production]

    [services.production.build]
    args = ["uv", "sync", "--frozen"]

    [services.production.run]
    args = ["uv", "run", "--directory", "services/compliance-api", "python", "run.py"]

    [services.production.run.env]
    PORT = "8000"
    NODE_ENV = "production"

    [services.production.health.startup]
    path = "/api/healthz"
    